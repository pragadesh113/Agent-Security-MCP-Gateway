<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Failure triggers and conservative behavior</title><rect width="1200" height="720" fill="white"/>
<text x="38" y="60.41" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203348">Failure triggers and conservative behavior</text>
<text x="38" y="88.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#637385">Representative locally exercised conditions; not exhaustive fault coverage.</text>
<polyline points="38,104 1162,104" fill="none" stroke="#b7c6d2" stroke-width="1.4"/>
<text x="38" y="694.79" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#637385">Agent Security MCP Gateway | Phase 2 | Original repository figure</text>
<rect x="40" y="140" width="510" height="48" fill="#285a86" stroke="#a8bbc9"/>
<text x="52" y="165.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Trigger</text>
<rect x="550" y="140" width="610" height="48" fill="#285a86" stroke="#a8bbc9"/>
<text x="562" y="165.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Safe response</text>
<rect x="40" y="188" width="510" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="52" y="213.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Arguments, route or policy changed</text>
<rect x="550" y="188" width="610" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="562" y="213.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Reject prior approval binding; require a new evaluation.</text>
<rect x="40" y="236" width="510" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="52" y="261.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Approval consumed or expired</text>
<rect x="550" y="236" width="610" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="562" y="261.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">No second forwarding-attempt record or credential use.</text>
<rect x="40" y="284" width="510" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="52" y="309.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Newer coverage degradation</text>
<rect x="550" y="284" width="610" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="562" y="309.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Block mutation before credential-consuming operation.</text>
<rect x="40" y="332" width="510" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="52" y="357.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Stale consumed dispatch; no outcome</text>
<rect x="550" y="332" width="610" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="562" y="357.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Persist UNKNOWN / possible partial effects; do not retry.</text>
<rect x="40" y="380" width="510" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="52" y="405.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Invalid provenance, schema or secret-bearing result</text>
<rect x="550" y="380" width="610" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="562" y="405.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Withhold, quarantine or redact before release.</text>
<rect x="40" y="428" width="510" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="52" y="453.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Required persistence unavailable</text>
<rect x="550" y="428" width="610" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="562" y="453.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Fail closed; no runtime in-memory fallback.</text>
</svg>