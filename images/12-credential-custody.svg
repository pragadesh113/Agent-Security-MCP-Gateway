<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Credential custody and the non-exporting sink</title><rect width="1200" height="720" fill="white"/>
<text x="38" y="60.41" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203348">Credential custody and the non-exporting sink</text>
<text x="38" y="88.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#637385">Model-visible data must never contain downstream credential material.</text>
<polyline points="38,104 1162,104" fill="none" stroke="#b7c6d2" stroke-width="1.4"/>
<text x="38" y="694.79" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#637385">Agent Security MCP Gateway | Phase 2 | Original repository figure</text>
<rect x="40" y="220" width="280" height="170" fill="#eef3f7" stroke="#a8bbc9"/>
<rect x="40" y="220" width="5" height="170" fill="#a24143" stroke="#a24143"/>
<text x="56" y="248.77" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#a24143">Agent / MCP client</text>
<text x="56" y="278.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Receives factual decisions and</text>
<text x="56" y="299.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">governed results. No downstream</text>
<text x="56" y="320.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">credential.</text>
<rect x="430" y="140" width="300" height="135" fill="#eef3f7" stroke="#a8bbc9"/>
<rect x="430" y="140" width="5" height="135" fill="#285a86" stroke="#285a86"/>
<text x="446" y="168.77" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#285a86">Vault provider</text>
<text x="446" y="198.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Version-pinned KV v2; audience and</text>
<text x="446" y="219.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">profile integrity</text>
<rect x="430" y="405" width="300" height="150" fill="#eef3f7" stroke="#a8bbc9"/>
<rect x="430" y="405" width="5" height="150" fill="#285a86" stroke="#285a86"/>
<text x="446" y="433.77" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#285a86">Credential broker</text>
<text x="446" y="463.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Lease binds action, attempt, route,</text>
<text x="446" y="484.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">endpoint, session and expiry</text>
<polyline points="580,275 580,405" fill="none" stroke="#285a86" stroke-width="1.4"/>
<polygon points="580,405 576.1058165769135,395.78939005997114 583.8941834230865,395.78939005997114" fill="#285a86"/>
<polyline points="320,305 430,465" fill="none" stroke="#285a86" stroke-width="1.4"/>
<polygon points="430,465 421.5729535914581,459.61623841275633 427.99089439374904,455.20390411118126" fill="#285a86"/>
<rect x="850" y="220" width="305" height="170" fill="#eef3f7" stroke="#a8bbc9"/>
<rect x="850" y="220" width="5" height="170" fill="#237e78" stroke="#237e78"/>
<text x="866" y="248.77" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#237e78">Non-exporting HTTP sink</text>
<text x="866" y="278.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Credential use inside the sink; exact</text>
<text x="866" y="299.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">endpoint; redirects refused</text>
<polyline points="730,480 1000,390" fill="none" stroke="#285a86" stroke-width="1.4"/>
<polygon points="1000,390 992.4934971093791,396.60699737801514 990.0305992606941,389.21830383196044" fill="#285a86"/>
<text x="40" y="640.45" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#637385">Diagram describes the implemented authority boundary. Disposable composition is not evidence of production credential custody.</text>
</svg>