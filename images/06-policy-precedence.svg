<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Most-restrictive decision composition</title><rect width="1200" height="720" fill="white"/>
<text x="38" y="60.41" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#203348">Most-restrictive decision composition</text>
<text x="38" y="88.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#637385">An approval satisfies an approval requirement; it never cancels denial.</text>
<polyline points="38,104 1162,104" fill="none" stroke="#b7c6d2" stroke-width="1.4"/>
<text x="38" y="694.79" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#637385">Agent Security MCP Gateway | Phase 2 | Original repository figure</text>
<rect x="40" y="140" width="100" height="48" fill="#285a86" stroke="#a8bbc9"/>
<text x="52" y="165.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Priority</text>
<rect x="140" y="140" width="330" height="48" fill="#285a86" stroke="#a8bbc9"/>
<text x="152" y="165.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Decision</text>
<rect x="470" y="140" width="690" height="48" fill="#285a86" stroke="#a8bbc9"/>
<text x="482" y="165.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Operational meaning</text>
<rect x="40" y="188" width="100" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="52" y="213.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">1</text>
<rect x="140" y="188" width="330" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="152" y="213.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">DENY</text>
<rect x="470" y="188" width="690" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="482" y="213.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Withhold the operation.</text>
<rect x="40" y="236" width="100" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="52" y="261.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">2</text>
<rect x="140" y="236" width="330" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="152" y="261.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">REQUIRE_APPROVAL</text>
<rect x="470" y="236" width="690" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="482" y="261.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Obtain one matching exact human authorization.</text>
<rect x="40" y="284" width="100" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="52" y="309.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">3</text>
<rect x="140" y="284" width="330" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="152" y="309.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">SANDBOX</text>
<rect x="470" y="284" width="690" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="482" y="309.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Execute only within the required validated sandbox.</text>
<rect x="40" y="332" width="100" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="52" y="357.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">4</text>
<rect x="140" y="332" width="330" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="152" y="357.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">ALLOW_WITH_CONSTRAINTS</text>
<rect x="470" y="332" width="690" height="48" fill="#ffffff" stroke="#a8bbc9"/>
<text x="482" y="357.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Enforce all compatible obligations.</text>
<rect x="40" y="380" width="100" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="52" y="405.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">5</text>
<rect x="140" y="380" width="330" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="152" y="405.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">ALLOW</text>
<rect x="470" y="380" width="690" height="48" fill="#f2f5f8" stroke="#a8bbc9"/>
<text x="482" y="405.28" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#203348">Proceed only after all remaining boundary checks.</text>
</svg>